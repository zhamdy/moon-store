services:
  - type: web
    name: moon-store-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    # Mirrors the live service (reconciled 2026-09-27). pnpm walks up from rootDir to the
    # workspace root for the lockfile; `--filter moon-store-server...` installs only the
    # API and its workspace dependencies.
    rootDir: apps/server
    buildCommand: corepack enable && HUSKY=0 pnpm install --frozen-lockfile --prod=false --filter moon-store-server...
    startCommand: pnpm --filter moon-store-server run migrate && pnpm --filter moon-store-server run start
    envVars:
      - key: NODE_ENV
        value: production
      # Neon project rapid-river-71535967 (aws-us-west-2, beside this service in Oregon),
      # branch `production`: the direct (non -pooler) connection string, set in the
      # Render dashboard. The free Render database below expired on 2026-09-21 and its
      # data was declared disposable (2026-09-27); it stays declared so nothing here can
      # delete it. The start command runs `migrate` on every boot; nothing here ever seeds.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Exact dashboard origins; credentialed CORS has no wildcard (isAllowedApiOrigin).
      - key: ALLOWED_ORIGINS
        sync: false
      # The dashboard (vercel.app) and this API (onrender.com) are different sites, so the
      # refresh cookie must be SameSite=None (which forces Secure) or refresh never works.
      - key: COOKIE_SAMESITE
        value: none
      - key: STOREFRONT_ORIGINS
        sync: false
      - key: CATALOG_SERVER_TOKEN
        sync: false
      - key: MEDIA_PUBLIC_BASE_URL
        sync: false

      # Media storage (#82). Unset, this is `local` and behaves exactly as before:
      # uploads land on the container filesystem and are lost on redeploy, because this
      # service configures no disk. That is the state this block exists to get out of.
      #
      # Pick ONE of the two:
      #
      # (a) A disk. Simplest, and enough for a single instance. Add a `disk:` block to
      #     this service and set MEDIA_LOCAL_ROOT to its mountPath. Note a Render disk
      #     cannot be shared between instances, so this does not survive scaling out.
      #
      #       disk:
      #         name: media
      #         mountPath: /var/media
      #         sizeGB: 1
      #       - key: MEDIA_LOCAL_ROOT
      #         value: /var/media
      #
      # (b) An S3-compatible bucket. Survives both redeploys and scaling out. Set these
      #     with `sync: false` so the credentials live in Render's dashboard and never in
      #     this file. Copy the existing `apps/server/uploads` tree into the bucket PRESERVING
      #     KEYS before switching, and read the migration order in CLAUDE.md -> Media
      #     storage: old rows hold relative /uploads/... URLs and keep resolving through
      #     the /uploads mount, so the copy can happen either side of the config change,
      #     but MEDIA_PUBLIC_BASE_URL must not point at the bucket until the objects are
      #     actually reachable there.
      #
      #       - key: MEDIA_STORAGE_DRIVER
      #         value: s3
      #       - key: MEDIA_S3_BUCKET
      #         sync: false
      #       - key: MEDIA_S3_REGION
      #         sync: false
      #       - key: MEDIA_S3_ENDPOINT      # only for R2 / Spaces / MinIO
      #         sync: false
      #       - key: MEDIA_S3_ACCESS_KEY_ID
      #         sync: false
      #       - key: MEDIA_S3_SECRET_ACCESS_KEY
      #         sync: false
      #       - key: MEDIA_PUBLIC_BASE_URL
      #         sync: false

databases:
  - name: moon-store-db
    plan: free
    databaseName: moon_store
    user: moon_store_user

services:
  - type: web
    name: moon-store-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev
    startCommand: npm run migrate && (npm run seed || true) && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: moon-store-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false

databases:
  - name: moon-store-db
    plan: free
    databaseName: moon_store
    user: moon_store_user
